kind = "web"
previewPath = "/"
title = "Ginger Studios & Creatives"
version = "1.0.0"
id = "artifacts/ginger-studios"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24382

[services.development]
run = "pnpm --filter @workspace/ginger-studios run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ginger-studios", "run", "build" ]
serve = "static"
publicDir = "artifacts/ginger-studios/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24382"
BASE_PATH = "/"
